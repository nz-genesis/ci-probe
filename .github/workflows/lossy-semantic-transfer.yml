name: Lossy Semantic Transfer

on:
  push:
    paths:
      - 'lossy_semantic_transfer.py'
      - '.github/workflows/lossy-semantic-transfer.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python lossy_semantic_transfer.py
