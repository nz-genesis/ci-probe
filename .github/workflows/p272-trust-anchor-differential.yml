name: P272 Trust Anchor Differential

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p272:
    name: p272-trust-anchor-differential
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
      - name: Execute P272 differential probe
        run: python3 p272_trust_anchor_differential_test.py
