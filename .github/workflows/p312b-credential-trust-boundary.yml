name: P312b Credential Trust Boundary Verification

on:
  push:
    paths:
      - 'p312_credential_trust_boundary.py'
      - '.github/workflows/p312b-credential-trust-boundary.yml'
  workflow_dispatch:

jobs:
  p312b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - run: python p312_credential_trust_boundary.py
