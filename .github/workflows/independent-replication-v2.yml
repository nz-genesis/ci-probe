name: Active IR-V2 Replication Verification

on:
  push:
    paths:
      - 'independent-replication/**'
      - '.github/workflows/independent-replication-v2.yml'
  pull_request:
    paths:
      - 'independent-replication/**'
      - '.github/workflows/independent-replication-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ir-v2:
    name: active-ir-v2-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"

      - name: Verify active manifest and frozen challenge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          challenge = Path('independent-replication/challenge-v2.json')
          manifest = Path('independent-replication/ACTIVE_MANIFEST.md')
          call = Path('independent-replication/INDEPENDENT_REPLICATION_CALL.md')
          readme = Path('independent-replication/README.md')
          assert challenge.is_file()
          assert manifest.is_file()
          assert call.is_file()
          assert readme.is_file()

          payload = json.loads(challenge.read_text())
          assert payload['schema_version'] == '2.0.0'
          assert payload['challenge_id'] == 'IR-V2'
          assert payload['status'] == 'FROZEN_NEUTRAL_PUBLIC_CHALLENGE'
          assert len(payload['cases']) >= 1
          assert len(payload['adversarial_cases']) >= 1
          assert payload['submission_contract']['required_fields']

          digest = hashlib.sha256(challenge.read_bytes()).hexdigest()
          expected = '03b25456a1ad0b40272daa1ca633910855433cfdce6ece8d0cf9e3352cd7ef1b'
          assert digest == expected, (digest, expected)

          manifest_text = manifest.read_text()
          call_text = call.read_text()
          readme_text = readme.read_text()
          assert 'IR-V2' in manifest_text
          assert expected in manifest_text
          assert 'IR-V2' in call_text
          assert expected in call_text
          assert 'IR-V2' in readme_text
          assert 'independence/' in readme_text
          print(f'PASS: IR-V2 challenge sha256={digest}')
          PY

      - name: Verify active protocol references
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ACTIVE PUBLIC PROTOCOL / IR-V2 COMPATIBLE' INDEPENDENT_REPLICATION_PROTOCOL.md
          grep -Fq 'active clean-room replication surface' README.md
          grep -Fq 'historical/control' README.md

      - name: Verify no active target ontology in public challenge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('independent-replication/challenge-v2.json').read_text().lower()
          forbidden = (
              'state + transition + capability',
              'candidate basis',
              'target ontology',
              'genesis primitive',
          )
          leaked = [item for item in forbidden if item in text]
          assert not leaked, leaked
          print('PASS: active challenge contains no checked target-ontology phrase')
          PY
