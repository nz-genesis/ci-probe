name: Ambiguity Cross-Domain Consumption

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run P192 probe
        run: python ambiguity_cross_domain_consumption.py
