name: Genesis Pass 26 Verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: pass26-public-safe-verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "CHECKED_OUT_SHA=$actual"

      - name: Execute Pass 26 probe
        run: python3 probes/pass26_fencing_idempotency_reconciliation.py
