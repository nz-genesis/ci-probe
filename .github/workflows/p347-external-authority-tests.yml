name: P347 External Authority Tests

on:
  push:
    branches:
      - research/p347-external-authority-v0
      - research/p347-external-authority-execution-v7
  workflow_dispatch:

permissions:
  contents: read


env:
  P347_WRANGLER_VERSION: "4.149.0"

jobs:
  authority-contract:
    name: external authority contract
    if: ${{ github.repository == 'nz-genesis/ci-probe' && github.ref == 'refs/heads/research/p347-external-authority-v0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run deterministic authority contract tests
        working-directory: p347/external-authority
        run: npm test


  external-authority-execution:
    name: real external authority execution
    if: ${{ github.repository == 'nz-genesis/ci-probe' && github.ref == 'refs/heads/research/p347-external-authority-execution-v7' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact checkout
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
      - name: Verify current Wrangler deployment contract
        run: npx --yes wrangler@4.149.0 --version
      - name: Validate Wrangler configuration without deployment
        working-directory: p347/external-authority
        run: npx --yes wrangler@4.149.0 deploy --dry-run --strict

      - name: Deploy temporary external authority with one version
        working-directory: p347/external-authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, secrets
          with open(".p347-secrets.json","w",encoding="utf-8") as f:
              json.dump({
                  "P347_ADMIN_TOKEN": secrets.token_hex(32),
                  "P347_EFFECT_TOKEN": secrets.token_hex(32),
              }, f)
          PY
          chmod 600 .p347-secrets.json
          set +e
          npx --yes wrangler@4.149.0 deploy --temporary --strict --secrets-file .p347-secrets.json --var "P347_SOURCE_VERSION:$GITHUB_SHA" > deployment.raw.txt 2>&1
          deploy_rc=$?
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path
          raw=Path("deployment.raw.txt").read_text(errors="replace")
          safe=re.sub(r'https://dash\.cloudflare\.com/claim-preview\?claimToken=[^\s]+', 'https://dash.cloudflare.com/claim-preview?claimToken=[REDACTED]', raw)
          safe=re.sub(r'(?i)(P347_ADMIN_TOKEN|P347_EFFECT_TOKEN)[=:][^\s]+', r'\1=[REDACTED]', safe)
          Path("deployment-diagnostic.txt").write_text(safe,encoding="utf-8")
          print(safe[-12000:])
          PY
          printf '%s\n' "$deploy_rc" > deployment.exit-code.txt
          test "$deploy_rc" -eq 0
          grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deployment.raw.txt | tail -1 > authority_url.txt
          test -s authority_url.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path(".p347-secrets.json").read_text())
          Path("admin_token.tmp").write_text(data["P347_ADMIN_TOKEN"])
          Path("effect_token.tmp").write_text(data["P347_EFFECT_TOKEN"])
          Path(".p347-secrets.json").unlink()
          PY
          chmod 600 admin_token.tmp effect_token.tmp
      - name: Wait for external authority readiness
        working-directory: p347/external-authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          url=Path("authority_url.txt").read_text().strip()
          expected=os.environ["GITHUB_SHA"]
          headers={
              "accept":"application/json",
              "user-agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36",
              "accept-language":"en-US,en;q=0.9",
          }
          attempts=[]
          ready=False
          for attempt in range(1,31):
              status=None
              body=None
              try:
                  req=Request(url+"/v1/state",method="GET",headers=headers)
                  with urlopen(req,timeout=10) as r:
                      status=r.status
                      body=json.loads(r.read().decode())
              except HTTPError as e:
                  status=e.code
                  try:
                      body=json.loads(e.read().decode())
                  except Exception:
                      body={"raw":e.read().decode(errors="replace")}
              except URLError as e:
                  body={"error":str(e)}
              attempts.append({"attempt":attempt,"status":status,"body":body})
              print(json.dumps(attempts[-1],sort_keys=True))
              if status==200 and body.get("authority")=="P347_EXTERNAL_AUTHORITY":
                  if body.get("source_version") != expected:
                      raise SystemExit("readiness source_version mismatch")
                  ready=True
                  break
              if status not in (1042,404):
                  break
              time.sleep(2)
          Path("readiness.json").write_text(json.dumps({"url":url,"expected_source_version":expected,"ready":ready,"attempts":attempts},indent=2,sort_keys=True)+"\n",encoding="utf-8")
          if not ready:
              raise SystemExit("external authority did not become ready within 60 seconds")

      - name: Execute real external authority discriminator
        working-directory: p347/external-authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          base=Path.cwd()
          url=base.joinpath("authority_url.txt").read_text().strip()
          admin=base.joinpath("admin_token.tmp").read_text().strip()
          effect=base.joinpath("effect_token.tmp").read_text().strip()
          source=os.environ["GITHUB_SHA"]
          def call(method,path,token=None,body=None,extra=None):
              headers={"accept":"application/json","user-agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36","accept-language":"en-US,en;q=0.9"}
              if token: headers["authorization"]="Bearer "+token
              if body is not None: headers["content-type"]="application/json"
              if extra: headers.update(extra)
              req=Request(url+path,method=method,headers=headers,data=None if body is None else json.dumps(body).encode())
              try:
                  with urlopen(req,timeout=30) as r: return r.status,json.loads(r.read().decode())
              except HTTPError as e: return e.code,json.loads(e.read().decode())
          evidence={"probe":"P347_EXTERNAL_AUTHORITY_REAL_EXECUTION_V4","observed_at":datetime.now(timezone.utc).isoformat(),"source_version":source,"wrangler_version":os.environ.get("P347_WRANGLER_VERSION","4.149.0"),"authority_url":url,"cases":[]}
          def require(name, condition, status, body):
              print("CASE", name, "status=", status, "body=", json.dumps(body, sort_keys=True))
              if condition:
                  return
              evidence["result"]="FAIL"
              evidence["failure"]={"case":name,"status":status,"body":body}
              Path("p347-external-authority-failure.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
              raise SystemExit(1)
          s,b=call("GET","/v1/state"); evidence["cases"].append({"name":"fresh_state","status":s,"body":b}); require("fresh_state", s==200 and b.get("generation")==1, s, b)
          s,b=call("POST","/v1/admin/mutate",admin,body={}); evidence["cases"].append({"name":"authority_mutation","status":s,"body":b}); require("authority_mutation", s==200 and b.get("generation")==2, s, b)
          h={"Idempotency-Key":"p347-real-e1","X-Request-Fingerprint":"fingerprint-1"}
          s,b=call("POST","/v1/effects",effect,{"generation":1,"payload":{"amount":1}},h); evidence["cases"].append({"name":"stale_generation_reject","status":s,"body":b}); require("stale_generation_reject", s==409 and b.get("reason")=="STALE_REJECT", s, b)
          current={"generation":2,"payload":{"amount":1}}
          s,b=call("POST","/v1/effects",effect,current,h); evidence["cases"].append({"name":"new_effect","status":s,"body":b}); require("new_effect", s==201 and b.get("duplicate") is False, s, b)
          eid=b["effect_id"]
          s,b=call("POST","/v1/effects",effect,current,h); evidence["cases"].append({"name":"same_key_same_payload_retry","status":s,"body":b}); require("same_key_same_payload_retry", s==200 and b.get("duplicate") is True and b.get("effect_id")==eid, s, b)
          h2={"Idempotency-Key":"p347-real-e1","X-Request-Fingerprint":"fingerprint-2"}
          s,b=call("POST","/v1/effects",effect,current,h2); evidence["cases"].append({"name":"same_key_different_payload_conflict","status":s,"body":b}); require("same_key_different_payload_conflict", s==409 and b.get("reason")=="CONFLICT", s, b)
          s,b=call("GET","/v1/effects/"+eid); evidence["cases"].append({"name":"fresh_effect_reobservation","status":s,"body":b}); require("fresh_effect_reobservation", s==200 and b.get("effect_id")==eid and b.get("outcome")=="OBSERVED_SUCCESS", s, b)
          evidence["result"]="PASS"
          Path("p347-external-authority-evidence.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("P347_EXTERNAL_AUTHORITY_REAL_EXECUTION=PASS")
          print("cases=7/7")
          PY
      - name: Remove local ephemeral credentials
        if: always()
        working-directory: p347/external-authority
        run: rm -f .p347-secrets.json admin_token.tmp effect_token.tmp
      - name: Upload sanitized external-authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p347-external-authority-real-${{ github.sha }}
          path: |
            p347/external-authority/deployment-diagnostic.txt
            p347/external-authority/p347-external-authority-evidence.json
            p347/external-authority/p347-external-authority-failure.json
            p347/external-authority/readiness.json
          if-no-files-found: ignore
