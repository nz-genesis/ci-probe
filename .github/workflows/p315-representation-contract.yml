name: P315 Representation Contract

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p315:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact triggering commit
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run P315 representation contract probe
        run: python p315_representation_contract.py
