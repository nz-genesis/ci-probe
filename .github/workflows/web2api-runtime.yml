name: Public Web2API Runtime Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'web2api-runtime/**'
      - '.github/workflows/web2api-runtime.yml'

permissions:
  contents: read

jobs:
  node:
    name: playwright-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install Playwright
        working-directory: web2api-runtime
        run: npm install --no-save --ignore-scripts playwright@1.64.1
      - name: Install Chromium
        working-directory: web2api-runtime
        run: npx playwright install --with-deps chromium
      - name: Execute real browser probe
        working-directory: web2api-runtime
        env:
          BROWSER_CANDIDATE: playwright-node
        run: node node-runner.mjs | tee result-playwright-node.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web2api-runtime-playwright-node
          path: web2api-runtime/result-playwright-node.json
          if-no-files-found: error

  python:
    name: playwright-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
          cache: pip
          cache-dependency-path: web2api-runtime/requirements-playwright.txt
      - name: Install Playwright
        working-directory: web2api-runtime
        run: python -m pip install -r requirements-playwright.txt
      - name: Install Chromium
        working-directory: web2api-runtime
        run: python -m playwright install --with-deps chromium
      - name: Execute real browser probe
        working-directory: web2api-runtime
        env:
          BROWSER_CANDIDATE: playwright-python
        run: python python-runner.py | tee result-playwright-python.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web2api-runtime-playwright-python
          path: web2api-runtime/result-playwright-python.json
          if-no-files-found: error
