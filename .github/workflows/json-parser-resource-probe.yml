name: JSON Parser Resource Probe

on:
  push:
    paths:
      - 'probes/json-parser-resource-probe.py'
      - 'probes/json-parser-resource-probe.md'
      - '.github/workflows/json-parser-resource-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-resource-observation:
    name: cpython-json-parser-resource-observation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"

      - name: Set up exact Python runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'

      - name: Record runtime identity
        run: |
          python --version
          python -c "import platform, sys; print('implementation=' + platform.python_implementation()); print('executable=' + sys.executable)"
          uname -a
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"

      - name: Execute generic parser resource probe
        shell: bash
        run: |
          set -o pipefail
          python probes/json-parser-resource-probe.py | tee json-parser-resource-report.json

      - name: Validate report structure and runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("json-parser-resource-report.json").read_text())
          assert report["implementation"] == "CPython"
          assert report["python_version"] == "3.14.7"
          assert len(report["results"]) == 6
          assert {row["case"] for row in report["results"]} == {"array", "object_pairs_hook"}
          assert {row["size_mib"] for row in report["results"]} == {1.0, 4.0, 8.0}
          for row in report["results"]:
              assert row["input_bytes"] == row["target_bytes"]
              assert row["top_level_items"] > 0
              assert row["parse_seconds"] >= 0
              assert row["peak_rss_kib"] >= row["baseline_rss_kib"]
          print("JSON_PARSER_RESOURCE_REPORT_VALID")
          PY

      - name: Upload exact-run resource report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: json-parser-resource-${{ github.sha }}
          path: json-parser-resource-report.json
          if-no-files-found: error
          retention-days: 30
