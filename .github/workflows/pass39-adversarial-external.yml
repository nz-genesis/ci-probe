name: Genesis Pass 39 Adversarial External World

on:
  workflow_dispatch:
  push:
    paths:
      - 'probes/pass39_adversarial_external_world.py'
      - '.github/workflows/pass39-adversarial-external.yml'

permissions:
  contents: read

jobs:
  pass39:
    name: public-safe-pass39
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"

      - name: Execute Pass 39
        run: python3 probes/pass39_adversarial_external_world.py
