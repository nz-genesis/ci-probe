name: Adaptive Public Observation

on:
  push:
    paths:
      - 'adaptive_public_observation.py'
      - '.github/workflows/adaptive-public-observation.yml'
      - 'research/ADAPTIVE_PUBLIC_OBSERVATION_2026-08-31.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute bounded probe
        run: python3 adaptive_public_observation.py
      - name: Require research record
        run: test -f research/ADAPTIVE_PUBLIC_OBSERVATION_2026-08-31.md
