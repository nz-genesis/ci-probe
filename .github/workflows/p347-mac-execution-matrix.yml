name: P347 Mac Execution Matrix

on:
  push:
    branches:
      - research/p347-mac-execution-matrix-v0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p347-mac-execution-matrix
  cancel-in-progress: false

jobs:
  mac:
    name: physical Mac execution matrix
    runs-on: [self-hosted, macOS, p347-mac]
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"
      - name: Run Mac execution matrix probe
        run: python3 probes/p347_mac_execution_matrix.py
      - name: Upload raw Mac execution matrix
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p347-mac-execution-matrix-${{ github.sha }}
          path: p347-mac-execution-matrix.json
          if-no-files-found: error


  differential-linux:
    name: hosted Linux differential reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run identical differential contract
        run: python3 probes/p347_differential_realization.py | tee differential-linux.txt
      - name: Upload Linux differential evidence
        uses: actions/upload-artifact@v4
        with:
          name: p347-differential-linux-${{ github.sha }}
          path: differential-linux.txt
