name: P271 Authority Root Adversarial

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p271:
    name: p271-authority-root-adversarial
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
      - name: Execute P271 authority-root adversarial probe
        run: python3 recursive_authority_root_adversarial_p271_test.py
