name: Pass 48 Crash Durable State

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass48:
    name: exact-sha-crash-durable-state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"

      - name: Run Go crash/durability probe
        run: go run -race ./probes/pass48_crash_durable_state.go
