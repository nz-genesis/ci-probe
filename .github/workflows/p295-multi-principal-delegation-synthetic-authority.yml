name: P295 Multi Principal Delegation Synthetic Authority

on:
  push:
  workflow_dispatch:

jobs:
  p295:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact triggering commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run P295
        run: python3 p295_multi_principal_delegation_synthetic_authority_test.py
