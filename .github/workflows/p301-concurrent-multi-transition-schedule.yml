name: P301 Concurrent Multi-Transition Schedule

on:
  push:
  workflow_dispatch:

jobs:
  p301:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact triggering commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run P301
        run: python3 p301_concurrent_multi_transition_schedule_test.py
