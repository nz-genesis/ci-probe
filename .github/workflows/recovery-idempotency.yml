name: Recovery Idempotency

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-idempotency:
    name: recovery-idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute clean-room experiment
        run: PYTHONPATH=. python3 recovery_idempotency.py
      - name: Execute regression tests
        run: PYTHONPATH=. python3 recovery_idempotency_test.py
      - name: Execute L6h concurrent duplicate-effect experiment
        run: PYTHONPATH=. python3 concurrent_duplicate_effect.py
      - name: Execute L6h regression tests
        run: PYTHONPATH=. python3 concurrent_duplicate_effect_test.py
      - name: Execute L6i atomicity coordination experiment
        run: PYTHONPATH=. python3 atomicity_coordination.py
      - name: Execute L6i regression tests
        run: PYTHONPATH=. python3 atomicity_coordination_test.py
