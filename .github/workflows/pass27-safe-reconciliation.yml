name: Genesis Pass 27 Safe Reconciliation

on:
  push:
    paths:
      - 'probes/pass27_safe_reconciliation.py'
      - '.github/workflows/pass27-safe-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass27-public-safe-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "TRIGGER_SHA=$GITHUB_SHA"
          echo "CHECKED_OUT_SHA=$actual"

      - name: Execute Pass 27 probe
        run: python3 probes/pass27_safe_reconciliation.py
