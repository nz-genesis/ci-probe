name: REA Ledger Comparison

on:
  pull_request:
  push:
    paths:
      - "probes/rea/**"
      - ".github/workflows/research-rea-ledger-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rea-ledger-comparison:
    name: exact-REA-ledger-comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CI probe at exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify probe checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'PROBE_GITHUB_SHA=%s\nPROBE_CHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual" | tee probe-checkout-identity.txt

      - name: Setup Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Checkout exact upstream REA commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rea-upstream
          git clone https://github.com/morluto/rea.git rea-upstream
          cd rea-upstream
          git fetch --depth 1 origin 6d1f39b250f8a1c6f924b1a6b9d26d56dff4beee
          git checkout --detach 6d1f39b250f8a1c6f924b1a6b9d26d56dff4beee
          actual="$(git rev-parse HEAD)"
          test "$actual" = "6d1f39b250f8a1c6f924b1a6b9d26d56dff4beee"
          printf 'REA_COMMIT=%s\n' "$actual" | tee ../rea-checkout-identity.txt

      - name: Install exact REA dependency graph
        working-directory: rea-upstream
        run: npm ci

      - name: Build REA
        working-directory: rea-upstream
        run: npm run build:cached

      - name: Install comparison vector
        shell: bash
        run: |
          set -euo pipefail
          cp probes/rea/reconstruction-ledger-comparison.test.ts rea-upstream/src/application/reconstruction-ledger-comparison.test.ts
          sed -i 's#"./src/application/#"./#g; s#"./src/domain/#"../domain/#g' rea-upstream/src/application/reconstruction-ledger-comparison.test.ts

      - name: Execute comparison vectors against exact REA
        working-directory: rea-upstream
        run: npx vitest run src/application/reconstruction-ledger-comparison.test.ts --reporter=verbose

      - name: Upload exact execution receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rea-ledger-comparison-evidence-${{ github.sha }}
          path: |
            probe-checkout-identity.txt
            rea-checkout-identity.txt
          if-no-files-found: error

# Execution probe revision: test file is staged into REA's supported src/application Vitest lane.
