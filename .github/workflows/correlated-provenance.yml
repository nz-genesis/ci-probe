name: Correlated Provenance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correlated-provenance:
    name: correlated-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep experiment and regression as separate executable gates.
      - name: Execute clean-room experiment
        run: PYTHONPATH=. python3 correlated_provenance.py

      - name: Execute regression tests
        run: PYTHONPATH=. python3 correlated_provenance_test.py
