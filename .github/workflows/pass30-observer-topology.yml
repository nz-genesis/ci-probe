name: genesis-pass30-observer-topology

on:
  push:
    paths:
      - 'probes/pass30_observer_topology.py'
      - '.github/workflows/pass30-observer-topology.yml'
  pull_request:
    paths:
      - 'probes/pass30_observer_topology.py'
      - '.github/workflows/pass30-observer-topology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observer-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"
      - name: Syntax check
        run: python3 -m py_compile probes/pass30_observer_topology.py
      - name: Run public-safe Pass 30 probe
        run: python3 probes/pass30_observer_topology.py
