name: P312 Credential Trust Boundary

on:
  push:
    paths:
      - 'p312_credential_trust_boundary.py'
      - '.github/workflows/p312-credential-trust-boundary.yml'
  workflow_dispatch:

jobs:
  p312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact triggering commit
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - run: python p312_credential_trust_boundary.py
