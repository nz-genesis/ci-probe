name: Temporal Authoritative Evidence

on:
  push:
    paths:
      - 'temporal_authoritative_evidence.py'
      - 'r5-recursive-authority-closure-v2/verify.py'
      - '.github/workflows/temporal-authoritative-evidence.yml'
  workflow_dispatch:

jobs:
  bounded-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute bounded probe
        run: python3 temporal_authoritative_evidence.py
      - name: Execute Genesis R5 Pass 2 exhaustive probe
        run: python3 r5-recursive-authority-closure-v2/verify.py
