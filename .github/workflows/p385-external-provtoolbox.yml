name: P385 External ProvToolbox Execution

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p385-external-provtoolbox.yml'
      - 'p385/**'

permissions:
  contents: read

jobs:
  external-provtoolbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4

      - name: Checkout frozen external implementation
        env:
          PROVTOOLBOX_SHA: bbff1d7eecd15175e6be8a055f67d311e40f9f04
        run: |
          set -euo pipefail
          git clone --no-tags https://github.com/lucmoreau/ProvToolbox.git p385/ProvToolbox
          cd p385/ProvToolbox
          git fetch --no-tags origin "$PROVTOOLBOX_SHA"
          git checkout --detach "$PROVTOOLBOX_SHA"
          test "$(git rev-parse HEAD)" = "$PROVTOOLBOX_SHA"

      - name: Capture toolchain
        run: |
          set -euo pipefail
          mkdir -p p385/receipt
          java -version 2> p385/receipt/java-version.txt || true
          mvn --version > p385/receipt/maven-version.txt
          git -C p385/ProvToolbox rev-parse HEAD > p385/receipt/external-commit.txt
          sha256sum p385/ProvToolbox/pom.xml > p385/receipt/external-pom.sha256

      - name: Execute external validation tests
        working-directory: p385/ProvToolbox
        run: |
          set -o pipefail
          mvn -pl modules-validation/prov-validation -am test 2>&1 | tee ../../receipt-maven-test.log

      - name: Write execution receipt
        if: always()
        env:
          PROVTOOLBOX_SHA: bbff1d7eecd15175e6be8a055f67d311e40f9f04
        run: |
          set -euo pipefail
          {
            echo "P385 EXTERNAL EXECUTION RECEIPT"
            echo "public harness repository: nz-genesis/ci-probe"
            echo "external repository: lucmoreau/ProvToolbox"
            echo "external commit: $PROVTOOLBOX_SHA"
            echo "workflow run: $GITHUB_RUN_ID"
            echo "run attempt: $GITHUB_RUN_ATTEMPT"
            echo "job: $GITHUB_JOB"
            echo "runner: $RUNNER_NAME"
            echo "maven test log: receipt-maven-test.log"
            echo "toolchain: receipt/java-version.txt, receipt/maven-version.txt"
            echo "source hashes: receipt/external-commit.txt, receipt/external-pom.sha256"
          } > p385/receipt/EXECUTION_RECEIPT.txt

      - name: Upload reproducible receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p385-external-provtoolbox-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            p385/receipt/
            receipt-maven-test.log
          if-no-files-found: error
