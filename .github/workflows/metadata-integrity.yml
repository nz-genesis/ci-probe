name: Metadata Integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-integrity:
    name: metadata-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute metadata integrity probe
        run: PYTHONPATH=. python3 metadata_integrity.py

      - name: Execute regression tests
        run: PYTHONPATH=. python3 metadata_integrity_test.py
