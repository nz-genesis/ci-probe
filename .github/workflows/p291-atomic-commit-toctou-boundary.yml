name: P291 Atomic Commit TOCTOU Boundary

on:
  push:
  workflow_dispatch:

jobs:
  p291:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact triggering commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run P291
        run: python3 p291_atomic_commit_toctou_boundary_test.py
