name: Pass 45 Dynamic Threshold

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass45:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Execute Pass 45
        run: python3 probes/pass45_dynamic_threshold_delegation.py
