name: Public Boundary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    name: public-content-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public boundary
        run: python3 public_boundary_check.py
