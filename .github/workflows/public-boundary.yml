name: Public Boundary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    name: public-content-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual" | tee pass49-checkout-identity.txt

      - name: Verify public boundary
        run: python3 public_boundary_check.py

      - name: Execute Pass 49 external-effect reconciliation probe
        shell: bash
        run: |
          set -o pipefail
          go run -race ./probes/pass49_external_effect_reconciliation.go | tee pass49-probe-output.txt

      - name: Upload Pass 49 hosted evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pass49-hosted-evidence-${{ github.sha }}
          path: |
            pass49-checkout-identity.txt
            pass49-probe-output.txt
          if-no-files-found: error
