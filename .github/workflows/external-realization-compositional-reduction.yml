name: External Realization Compositional Reduction

on:
  push:
    paths:
      - 'external_realization_compositional_reduction.py'
      - '.github/workflows/external-realization-compositional-reduction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compositional-reduction:
    runs-on: ubuntu-latest
    steps:
      - name: Set up job
        run: python --version
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run compositional reduction
        run: python external_realization_compositional_reduction.py
