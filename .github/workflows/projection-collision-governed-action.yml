name: Projection Collision Governed Action

on:
  push:
    paths:
      - 'projection_collision_governed_action.py'
      - '.github/workflows/projection-collision-governed-action.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python projection_collision_governed_action.py
