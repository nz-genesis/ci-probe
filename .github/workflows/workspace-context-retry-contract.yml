name: Workspace Context Retry Contract (Public Generic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: public-safe-composer-context-retry-contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\\nCHECKED_OUT_SHA=%s\\n' "$GITHUB_SHA" "$actual"
      - name: Run generic composer context retry contract
        run: python3 probes/generic-composer-context-retry-contract.py
      - name: Capture receipt
        if: always()
        shell: bash
        run: |
          {
            printf 'workflow=%s\\n' "$GITHUB_WORKFLOW"
            printf 'run_id=%s\\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\\n' "$GITHUB_RUN_ATTEMPT"
            printf 'commit=%s\\n' "$GITHUB_SHA"
            printf 'job_status=%s\\n' "${{ job.status }}"
          } > workspace-context-retry-receipt.txt
      - name: Upload exact execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-context-retry-${{ github.run_id }}-${{ github.run_attempt }}
          path: workspace-context-retry-receipt.txt
          if-no-files-found: error
