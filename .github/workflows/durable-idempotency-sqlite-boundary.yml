name: Durable Idempotency SQLite Boundary

on:
  push:
    branches:
      - probe/durable-idempotency-sqlite-boundary-2026-11-06
    paths:
      - probes/durable_idempotency_sqlite_boundary.py
      - .github/workflows/durable-idempotency-sqlite-boundary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"
      - name: Set up Python 3.14.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
          cache: false
      - name: Execute generic SQLite idempotency and crash boundary
        env:
          PYTHONHASHSEED: '0'
        run: python probes/durable_idempotency_sqlite_boundary.py
      - name: Upload exact probe result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: durable-idempotency-sqlite-${{ github.sha }}
          path: durable-idempotency-sqlite-result.json
          if-no-files-found: warn
