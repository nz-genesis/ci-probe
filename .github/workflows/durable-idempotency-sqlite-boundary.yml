name: Durable Idempotency SQLite Boundary

on:
  push:
    branches:
      - probe/durable-idempotency-sqlite-boundary-2026-11-06
    paths:
      - probes/durable_idempotency_sqlite_boundary.py
      - .github/workflows/durable-idempotency-sqlite-boundary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-boundary:
    name: sqlite-boundary-python-${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14.7', '3.14.10', '3.15.2']
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute generic SQLite idempotency and crash boundary
        env:
          PYTHONHASHSEED: '0'
        run: python probes/durable_idempotency_sqlite_boundary.py
      - name: Upload exact probe result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durable-idempotency-sqlite-${{ matrix.python-version }}-${{ github.sha }}
          path: durable-idempotency-sqlite-result.json
          if-no-files-found: warn
