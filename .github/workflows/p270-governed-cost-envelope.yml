name: P270 Governed Cost Envelope

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p270:
    name: p270-governed-cost-envelope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Execute cost-envelope probe
        run: python3 governed_cost_envelope_p270_test.py
