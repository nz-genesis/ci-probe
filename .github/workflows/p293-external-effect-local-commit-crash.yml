name: P293 External Effect Local Commit Crash

on:
  push:
  workflow_dispatch:

jobs:
  p293:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact triggering commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run P293
        run: python3 p293_external_effect_local_commit_crash_test.py
