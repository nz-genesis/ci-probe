name: p387-external-sbmd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p387-external-sbmd:
    name: p387-frozen-external-sbmd
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout probe
        uses: actions/checkout@v4

      - name: Capture runner identity
        run: |
          set -euo pipefail
          uname -a
          node --version || true
          npm --version || true

      - name: Record explicit research execution trigger
        run: |
          set -euo pipefail
          printf '%s\n' 'P387 external source-native execution trigger: 2026-09-09 continuation' 'No semantic fixture or candidate mapping is introduced by this step.'

      - name: Setup Node 16 for frozen Angular 14 lineage
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      - name: Clone frozen external implementation
        env:
          EXTERNAL_REPO: https://github.com/SebastianGTTS/situational-business-model-developer.git
          EXTERNAL_SHA: 4b49f93423cc2c17822f794a12187130c2c11202
        run: |
          set -euo pipefail
          rm -rf external/sbmd
          git clone "$EXTERNAL_REPO" external/sbmd
          git -C external/sbmd checkout --detach "$EXTERNAL_SHA"
          actual="$(git -C external/sbmd rev-parse HEAD)"
          test "$actual" = "$EXTERNAL_SHA"
          printf 'external_repo=%s\nexternal_expected_sha=%s\nexternal_checked_out_sha=%s\n' "$EXTERNAL_REPO" "$EXTERNAL_SHA" "$actual" | tee p387-external-identity.txt

      - name: Verify frozen external package contract
        working-directory: external/sbmd
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          node -e 'const p=require("./package.json"); if(p.name!=="bmdl-modeler") process.exit(1); if(p.version!=="1.2.0") process.exit(1); if(p.scripts?.test!=="jest") process.exit(1); if(p.scripts?.build!=="ng build") process.exit(1); console.log(JSON.stringify({name:p.name,version:p.version,test:p.scripts.test,build:p.scripts.build}))' | tee ../p387-package-contract.txt

      - name: Install exact locked dependencies
        working-directory: external/sbmd
        run: npm ci

      - name: Execute external implementation test suite
        working-directory: external/sbmd
        run: npm test -- --runInBand

      - name: Build external implementation
        working-directory: external/sbmd
        run: npm run build

      - name: Upload P387 exact hosted execution receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p387-execution-receipt-${{ github.sha }}
          path: |
            p387-external-identity.txt
            p387-package-contract.txt
          if-no-files-found: warn
