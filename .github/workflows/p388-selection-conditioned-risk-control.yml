name: P388 Selection Conditioned Risk Control

on:
  push:
    paths:
      - 'p388_selection_conditioned_risk_control.py'
      - '.github/workflows/p388-selection-conditioned-risk-control.yml'
  pull_request:
    paths:
      - 'p388_selection_conditioned_risk_control.py'
      - '.github/workflows/p388-selection-conditioned-risk-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p388:
    name: p388-public-safe-risk-control
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"
      - name: Runtime identification
        run: |
          python3 --version
          uname -a
      - name: Execute P388
        run: python3 p388_selection_conditioned_risk_control.py
