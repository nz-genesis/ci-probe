name: P289 protected boundary realization comparison

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  p289:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Run P289 probe
        run: python3 p289_protected_boundary_realization_comparison_test.py
