name: P287 verifier dependency substitution

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  p287:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Run P287 probe
        run: python3 p287_verifier_dependency_substitution_test.py
