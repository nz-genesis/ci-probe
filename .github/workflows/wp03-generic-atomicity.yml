name: WP-03 Generic Atomicity Probe

on:
  push:
    paths:
      - 'probes/wp03_atomic_snapshot_generic.py'
      - '.github/workflows/wp03-generic-atomicity.yml'

permissions:
  contents: read

jobs:
  generic-atomicity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"
      - name: Identify runtime
        run: python3 --version
      - name: Run sanitized generic atomicity probe
        shell: bash
        run: |
          set -euo pipefail
          python3 probes/wp03_atomic_snapshot_generic.py | tee wp03-generic-atomicity.txt
      - name: Upload bounded evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp03-generic-atomicity-${{ github.sha }}
          path: wp03-generic-atomicity.txt
          if-no-files-found: error
