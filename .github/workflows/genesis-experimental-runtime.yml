name: Genesis Experimental Runtime Contract

on:
  push:
    paths:
      - "genesis-experimental-adapter/main.go"
      - "genesis-experimental-adapter/main_test.go"
      - "genesis-experimental-adapter/go.mod"
      - ".github/workflows/genesis-experimental-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    name: public-contract-execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Verify formatting
        working-directory: genesis-experimental-adapter
        run: test -z "$(gofmt -l main.go main_test.go)"

      - name: Run static analysis
        working-directory: genesis-experimental-adapter
        run: go vet ./...

      - name: Run semantic contract tests
        working-directory: genesis-experimental-adapter
        run: go test -race -count=1 ./...

      - name: Run public adapter
        working-directory: genesis-experimental-adapter
        run: |
          go run . | tee result.txt
          grep -Fx "GENESIS_PUBLIC_CONTRACT_PROBE_OK" result.txt

      - name: Persist public execution evidence
        env:
          GH_SHA: ${{ github.sha }}
          GH_RUN: ${{ github.run_id }}
        run: |
          printf 'workflow=Genesis Experimental Runtime Contract\ncommit=%s\nrun_id=%s\nresult=PASS\n' "$GH_SHA" "$GH_RUN" > genesis-experimental-adapter/ci-proof.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add genesis-experimental-adapter/ci-proof.txt
          git commit -m "ci: record public Genesis contract probe result" || exit 0
          git push

      # Keep the public proof generated only after all contract gates pass.
