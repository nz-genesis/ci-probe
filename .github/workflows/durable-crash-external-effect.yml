name: Durable Crash External Effect
on:
  push:
    paths:
      - 'durable_crash_external_effect_recovery.py'
      - '.github/workflows/durable-crash-external-effect.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python durable_crash_external_effect_recovery.py
