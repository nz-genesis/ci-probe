name: Pass 49 External Effect Reconciliation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass49:
    name: exact-sha-external-effect-reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"

      - name: Run Go external-effect reconciliation probe
        run: go run -race ./probes/pass49_external_effect_reconciliation.go
