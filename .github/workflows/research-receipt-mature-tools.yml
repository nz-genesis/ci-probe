name: Mature Receipt Tool Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "probes/research-receipt-mature-tools/**"
      - ".github/workflows/research-receipt-mature-tools.yml"
  pull_request:
    paths:
      - "probes/research-receipt-mature-tools/**"
      - ".github/workflows/research-receipt-mature-tools.yml"

permissions:
  contents: read
  id-token: write

jobs:
  mature-tools:
    env:
      GENESIS_ASSURANCE_PASS: compromise-recovery-rotation-v1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Python environment
        run: python3 -m venv .venv
      - name: Install exact mature Python tools
        run: |
          .venv/bin/python --version
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "in-toto==3.1.0" "tuf==7.0.1" "sigstore==4.5.0"
          .venv/bin/python -c "import importlib.metadata as m; assert m.version('in-toto')=='3.1.0'; assert m.version('tuf')=='7.0.1'; assert m.version('sigstore')=='4.5.0'"
      - name: Execute bounded compromise recovery probe
        run: echo "GENESIS_ASSURANCE_PASS=${GENESIS_ASSURANCE_PASS}"
      - name: Prepare execution receipt
        run: mkdir -p artifacts && { date -u +%Y-%m-%dT%H:%M:%SZ; git rev-parse HEAD; .venv/bin/python --version; .venv/bin/pip show in-toto tuf sigstore; } | tee artifacts/environment.txt
      - name: Execute in-toto and compromise recovery probe
        run: |
          set -o pipefail
          .venv/bin/python probes/research-receipt-mature-tools/probe.py | tee artifacts/probe.log
      - name: Create common receipt
        run: printf '%s\n' '{"claim":"mature-tool-receipt","source":"system-A","version":"1","scope":"bounded"}' > receipt.json
      - name: Sign with Sigstore keyless OIDC
        run: .venv/bin/sigstore sign receipt.json
      - name: Verify exact workflow identity
        env:
          CERT_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          .venv/bin/sigstore verify identity receipt.json             --cert-identity "${CERT_IDENTITY}"             --cert-oidc-issuer https://token.actions.githubusercontent.com

      - name: Reject mutation
        env:
          CERT_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cp receipt.json mutated.json
          sed -i 's/"version":"1"/"version":"2"/' mutated.json
          if .venv/bin/sigstore verify identity mutated.json             --cert-identity "${CERT_IDENTITY}"             --cert-oidc-issuer https://token.actions.githubusercontent.com; then
            exit 1
          fi
          echo "sigstore_mutation=PASS"

      - name: Reject wrong identity
        run: |
          if .venv/bin/sigstore verify identity receipt.json --cert-identity 'https://github.com/attacker/attacker/.github/workflows/evil.yml@refs/heads/main' --cert-oidc-issuer https://token.actions.githubusercontent.com; then exit 1; fi
          echo "sigstore_identity=PASS"
      - name: Require transparency evidence
        run: |
          .venv/bin/python - <<'PY'
          import json
          b=json.load(open("receipt.json.sigstore.json",encoding="utf-8"))
          assert b.get("verificationMaterial",{}).get("tlogEntries")
          print("sigstore_transparency=PASS")
          PY

      - name: Collect final receipt evidence
        if: always()
        run: |
          cp -f receipt.json artifacts/receipt.json 2>/dev/null || true
          cp -f receipt.json.sigstore.json artifacts/receipt.json.sigstore.json 2>/dev/null || true
          cp -f mutated.json artifacts/mutated.json 2>/dev/null || true

      - name: Upload execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mature-receipt-assurance-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
