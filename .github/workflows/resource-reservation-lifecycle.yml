name: Generic Resource Reservation Lifecycle

on:
  workflow_dispatch:
  push:
    paths:
      - "probes/test_resource_reservation_lifecycle.py"
      - ".github/workflows/resource-reservation-lifecycle.yml"

permissions:
  contents: read

concurrency:
  group: resource-reservation-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generic-reservation-contract:
    name: generic-reservation-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"
      - name: Identify Python runtime
        run: python3 --version
      - name: Run generic reservation lifecycle contract tests
        run: python3 probes/test_resource_reservation_lifecycle.py
