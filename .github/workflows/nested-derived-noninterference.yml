name: Nested Derived Noninterference

on:
  push:
    paths:
      - 'nested_derived_noninterference.py'
      - '.github/workflows/nested-derived-noninterference.yml'
      - 'research/NESTED_DERIVED_NONINTERFERENCE_2026-08-31.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute bounded probe
        run: python3 nested_derived_noninterference.py
      - name: Require research record
        run: test -f research/NESTED_DERIVED_NONINTERFERENCE_2026-08-31.md
