name: Genesis Runtime Uncertainty HITL Reduction

on:
  workflow_dispatch:
  push:
    paths:
      - 'genesis_runtime_uncertainty_hitl_reduction_probe.py'
      - '.github/workflows/genesis-runtime-uncertainty-hitl-reduction.yml'

jobs:
  uncertainty-hitl-reduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run clean-room uncertainty reduction
        run: python3 genesis_runtime_uncertainty_hitl_reduction_probe.py
      - name: Verify public-safe boundary
        run: |
          ! grep -R -E '(private corpus|private witness|private authority|secret)' genesis_runtime_uncertainty_hitl_reduction_probe.py
