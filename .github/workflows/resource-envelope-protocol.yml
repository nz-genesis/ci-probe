name: Resource Envelope Protocol Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "independent-replication/RESOURCE_ENVELOPE_BENCHMARK_PROTOCOL.md"
      - "independent-replication/test_resource_envelope_protocol.py"
      - ".github/workflows/resource-envelope-protocol.yml"
  push:
    paths:
      - "independent-replication/RESOURCE_ENVELOPE_BENCHMARK_PROTOCOL.md"
      - "independent-replication/test_resource_envelope_protocol.py"
      - ".github/workflows/resource-envelope-protocol.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify protocol contract
        run: python -m unittest independent-replication/test_resource_envelope_protocol.py -v
