name: CI Probe

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: public-github-hosted-execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"
      - name: Runtime identification
        run: |
          python3 --version
          uname -a
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
      - name: Execute deterministic substrate probe
        run: python3 probe.py
      - name: Execute generic action semantics tests
        run: python3 -m unittest -v test_action_probe.py
      - name: Execute Pass 22 public-safe semantic probe
        run: python3 probes/pass22_distributed_freshness_reservation.py
      - name: Execute Pass 25 public-safe runtime contract probe
        run: python3 probes/pass25_runtime_contract_probe.py
      - name: Execute Pass 26 public-safe fencing/idempotency probe
        run: python3 probes/pass26_fencing_idempotency_reconciliation.py
      - name: Execute Pass 35 public-safe Byzantine evidence probe
        run: python3 probes/pass35_byzantine_evidence.py
      - name: Execute Pass 36 public-safe evidence replay/recovery probe
        run: python3 probes/pass36_evidence_replay_recovery.py
      - name: Execute Pass 37 public-safe lost ACK/concurrent recovery probe
        run: python3 probes/pass37_lost_ack_concurrent_recovery.py
      - name: Execute Pass 38 public-safe crash-after-effect/fencing probe
        run: python3 probes/pass38_crash_after_effect_fencing.py
      - name: Execute Pass 39 public-safe adversarial external-world probe
        run: python3 probes/pass39_adversarial_external_world.py
      - name: Execute Pass 40 public-safe effect-identity/realization-contract probe
        run: python3 probes/pass40_effect_identity_realization_contract.py
      - name: Execute Pass 41 public-safe realization-contract substitution probe
        run: python3 probes/pass41_realization_contract_substitution.py
      - name: Execute Pass 42 public-safe contract-change/revocation/conflict probe
        run: python3 probes/pass42_contract_change_revocation_conflict.py
      - name: Execute Pass 43 public-safe realization-contract primitive-reduction probe
        run: python3 probes/pass43_realization_contract_primitive_reduction.py
      - name: Execute Pass 44 public-safe multi-party authority/concurrent-revocation probe
        run: python3 probes/pass44_multiparty_authority_concurrent_revocation.py
      - name: Execute Pass 45 public-safe dynamic-threshold/delegation reduction probe
        run: python3 probes/pass45_dynamic_threshold_delegation.py
      - name: Execute Pass 46 public-safe concurrent delegation/revocation/cycle reduction probe
        run: python3 probes/pass46_concurrent_delegation_revocation_cycles.py
      - name: Execute Pass 47 public-safe concurrent kernel probe
        run: go run -race ./probes/pass47_concurrent_kernel.go
      - name: Execute Pass 48 public-safe crash/durable-state probe
        run: go run -race ./probes/pass48_crash_durable_state.go
      - name: Capture Pass 49 exact hosted checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual" | tee pass49-checkout-identity.txt
      - name: Execute Pass 49 public-safe external-effect reconciliation probe
        shell: bash
        run: |
          set -o pipefail
          go run -race ./probes/pass49_external_effect_reconciliation.go | tee pass49-probe-output.txt
      - name: Execute Pass 208 public-safe constructive Genesis Base synthesis probe
        shell: bash
        run: |
          set -o pipefail
          python3 probes/p208_constructive_base_synthesis.py | tee p208-probe-output.txt
      - name: Execute Pass 209 public-safe decision/selection reduction probe
        shell: bash
        run: |
          set -o pipefail
          python3 probes/p209_decision_selection_reduction.py | tee p209-probe-output.txt
      - name: Execute Pass 210 public-safe adaptive-plan reduction probe
        shell: bash
        run: |
          set -o pipefail
          python3 probes/p210_adaptive_plan_reduction.py | tee p210-probe-output.txt
      - name: Execute Pass 211 public-safe self-evolution/system-construction reduction probe
        shell: bash
        run: |
          set -o pipefail
          python3 probes/p211_self_evolution_system_construction_reduction.py | tee p211-probe-output.txt
      - name: Execute Pass 212 public-safe objective/tradeoff reduction probe
        shell: bash
        run: |
          set -o pipefail
          python3 objective_tradeoff_reduction.py | tee p212-probe-output.txt
      - name: Execute Pass 213 public-safe partial-order normative reduction probe
        shell: bash
        run: |
          set -o pipefail
          python3 partial_order_normative_reduction.py | tee p213-probe-output.txt
      - name: Upload Pass 49 exact hosted execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pass49-execution-evidence-${{ github.sha }}
          path: |
            pass49-checkout-identity.txt
            pass49-probe-output.txt
          if-no-files-found: error
      - name: Upload P210 exact hosted execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p210-execution-evidence-${{ github.sha }}
          path: p210-probe-output.txt
          if-no-files-found: error
      - name: Upload P211 exact hosted execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p211-execution-evidence-${{ github.sha }}
          path: p211-probe-output.txt
          if-no-files-found: error
      - name: Upload P212 exact hosted execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p212-execution-evidence-${{ github.sha }}
          path: p212-probe-output.txt
          if-no-files-found: error
      - name: Upload P213 exact hosted execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p213-execution-evidence-${{ github.sha }}
          path: p213-probe-output.txt
          if-no-files-found: error
      - name: Verify probe artifact
        run: |
          test -f ci-probe-result.txt
          grep -Fx "CI_PROBE_OK" ci-probe-result.txt
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: ci-probe-result-${{ github.run_id }}
          path: ci-probe-result.txt
          if-no-files-found: error

# P212: competing objectives/trade-offs are tested as State/Transition composition; no Objective/Goal/Tradeoff/Utility/Planner primitive is asserted.
# P213: partial-order/incomparable objectives are tested as State relation + Transition + existing Authority/Constraint boundaries; no new primitive is asserted.


  p347-worker:
    if: github.ref_name == 'research/p347-multi-host-governance-boundary-v0'
    name: p347-worker-a
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Fetch exact frozen P347 probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/contents/probes/p347_multi_host_governance_boundary.py?ref=${GITHUB_SHA}" --jq '.content' | tr -d '\n' | base64 -d > p347_multi_host_governance_boundary.py
          python3 -m py_compile p347_multi_host_governance_boundary.py
          printf 'WORKER_SHA=%s HOST=%s RUNNER=ubuntu-22.04\n' "$GITHUB_SHA" "$(hostname)"
      - name: Execute P347 worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P347_BRANCH: ${{ github.ref_name }}
          P347_OUT: worker-result.json
        run: python3 p347_multi_host_governance_boundary.py worker
      - uses: actions/upload-artifact@v4
        with:
          name: p347-worker-result
          path: worker-result.json

  p347-authority:
    if: github.ref_name == 'research/p347-multi-host-governance-boundary-v0'
    name: p347-authority-c
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Fetch exact frozen P347 probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/contents/probes/p347_multi_host_governance_boundary.py?ref=${GITHUB_SHA}" --jq '.content' | tr -d '\n' | base64 -d > p347_multi_host_governance_boundary.py
          python3 -m py_compile p347_multi_host_governance_boundary.py
          printf 'AUTHORITY_SHA=%s HOST=%s RUNNER=ubuntu-24.04\n' "$GITHUB_SHA" "$(hostname)"
      - name: Execute P347 authority
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P347_BRANCH: ${{ github.ref_name }}
          P347_OUT: authority-result.json
        run: python3 p347_multi_host_governance_boundary.py authority
      - uses: actions/upload-artifact@v4
        with:
          name: p347-authority-result
          path: authority-result.json

  p347-observer:
    if: github.ref_name == 'research/p347-multi-host-governance-boundary-v0'
    name: p347-independent-observer-b
    needs: [p347-worker, p347-authority]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Fetch exact frozen P347 probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/contents/probes/p347_multi_host_governance_boundary.py?ref=${GITHUB_SHA}" --jq '.content' | tr -d '\n' | base64 -d > p347_multi_host_governance_boundary.py
          python3 -m py_compile p347_multi_host_governance_boundary.py
      - name: Execute independent P347 observer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P347_BRANCH: ${{ github.ref_name }}
          P347_OUT: observer-result.json
        run: python3 p347_multi_host_governance_boundary.py observer
      - uses: actions/download-artifact@v4
        with:
          pattern: p347-*-result
          merge-multiple: true
      - name: Verify P347 semantic boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          worker=json.load(open("worker-result.json"))
          authority=json.load(open("authority-result.json"))
          observer=json.load(open("observer-result.json"))
          assert worker["real_child_sigkill_observed"] is True
          assert worker["stale_effect_rejected_409"] is True
          assert authority["generation_after_mutation"] == 2
          assert observer["authoritative_final_generation_2"] is True
          assert observer["distinct_runner_hosts"] is True
          print("P347_MULTI_HOST_CORE_BOUNDARY=PASS")
          print("P347_STALE_AUTHORITY_REJECTION=PASS")
          print("P347_REAL_PROCESS_CRASH_INTERLEAVING=PASS")
          print("P347_INDEPENDENT_OBSERVER=PASS")
          print("P347_VERDICT=SUPPORTED_BOUNDED_MULTI_HOST_EXECUTION")
          PY
