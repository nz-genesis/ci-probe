name: CI Probe

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: public-github-hosted-execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"

      - name: Runtime identification
        run: |
          python3 --version
          uname -a
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"

      - name: Execute deterministic substrate probe
        run: python3 probe.py

      - name: Execute generic action semantics tests
        run: python3 -m unittest -v test_action_probe.py

      - name: Execute Pass 22 public-safe semantic probe
        run: python3 probes/pass22_distributed_freshness_reservation.py

      - name: Execute Pass 25 public-safe runtime contract probe
        run: python3 probes/pass25_runtime_contract_probe.py

      - name: Execute Pass 26 public-safe fencing/idempotency probe
        run: python3 probes/pass26_fencing_idempotency_reconciliation.py

      - name: Execute Pass 35 public-safe Byzantine evidence probe
        run: python3 probes/pass35_byzantine_evidence.py

      - name: Execute Pass 36 public-safe evidence replay/recovery probe
        run: python3 probes/pass36_evidence_replay_recovery.py

      - name: Execute Pass 37 public-safe lost ACK/concurrent recovery probe
        run: python3 probes/pass37_lost_ack_concurrent_recovery.py

      - name: Execute Pass 38 public-safe crash-after-effect/fencing probe
        run: python3 probes/pass38_crash_after_effect_fencing.py

      - name: Execute Pass 39 public-safe adversarial external-world probe
        run: python3 probes/pass39_adversarial_external_world.py

      - name: Execute Pass 40 public-safe effect-identity/realization-contract probe
        run: python3 probes/pass40_effect_identity_realization_contract.py

      - name: Execute Pass 41 public-safe realization-contract substitution probe
        run: python3 probes/pass41_realization_contract_substitution.py

      - name: Execute Pass 42 public-safe contract-change/revocation/conflict probe
        run: python3 probes/pass42_contract_change_revocation_conflict.py

      - name: Execute Pass 43 public-safe realization-contract primitive-reduction probe
        run: python3 probes/pass43_realization_contract_primitive_reduction.py

      - name: Verify probe artifact
        run: |
          test -f ci-probe-result.txt
          grep -Fx "CI_PROBE_OK" ci-probe-result.txt

      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: ci-probe-result-${{ github.run_id }}
          path: ci-probe-result.txt
          if-no-files-found: error
