name: CI Probe

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: public-github-hosted-execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          printf 'EVENT_SHA=%s\nEXPECTED_CHECKOUT_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$expected" "$actual"

      - name: Runtime identification
        run: |
          python3 --version
          uname -a
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"

      - name: Execute deterministic substrate probe
        run: python3 probe.py

      - name: Execute generic action semantics tests
        run: python3 -m unittest -v test_action_probe.py

      - name: Execute Pass 22 public-safe semantic probe
        run: python3 probes/pass22_distributed_freshness_reservation.py

      - name: Execute Pass 25 public-safe runtime contract probe
        run: python3 probes/pass25_runtime_contract_probe.py

      - name: Verify probe artifact
        run: |
          test -f ci-probe-result.txt
          grep -Fx "CI_PROBE_OK" ci-probe-result.txt

      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: ci-probe-result-${{ github.run_id }}
          path: ci-probe-result.txt
          if-no-files-found: error
