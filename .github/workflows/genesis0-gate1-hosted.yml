name: Genesis0 Gate 1 Hosted Verification

on:
  workflow_dispatch:
    inputs:
      genesis_lab_commit:
        description: "Exact genesis-lab commit to verify"
        required: true
        default: "1c49b9e654ddcce001556740a76a5a8ba9f4ad7a"
  push:

jobs:
  genesis0-gate1:
    runs-on: ubuntu-latest
    env:
      GENESIS_LAB_COMMIT: ${{ github.event.inputs.genesis_lab_commit || '1c49b9e654ddcce001556740a76a5a8ba9f4ad7a' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Genesis0 hosted executable probe
        run: python3 probes/genesis0-gate1-hosted.py
