name: Non-Idempotent Timeout Impossibility

on:
  push:
    paths:
      - 'non_idempotent_timeout_impossibility.py'
      - '.github/workflows/non-idempotent-timeout-impossibility.yml'
      - 'research/NON_IDEMPOTENT_TIMEOUT_IMPOSSIBILITY_2026-08-31.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute bounded probe
        run: python3 non_idempotent_timeout_impossibility.py
      - name: Require research record
        run: test -f research/NON_IDEMPOTENT_TIMEOUT_IMPOSSIBILITY_2026-08-31.md
