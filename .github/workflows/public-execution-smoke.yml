name: public-execution-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GENESIS_PUBLIC_PROBE: pass22_distributed_freshness_reservation.py

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"
      - name: Execute public-safe probe
        run: python3 "$GENESIS_PUBLIC_PROBE"
      - name: Emit identity
        run: |
          printf 'repository=%s\nworkflow=%s\nrun_id=%s\nsha=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_SHA"
