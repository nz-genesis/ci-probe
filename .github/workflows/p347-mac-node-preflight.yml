name: P347 Mac Node Preflight

on:
  push:
    branches:
      - research/p347-mac-node-preflight-v0

permissions:
  contents: read

concurrency:
  group: p347-mac-node-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: macOS bounded execution identity
    if: ${{ github.repository == 'nz-genesis/ci-probe' && github.ref == 'refs/heads/research/p347-mac-node-preflight-v0' }}
    runs-on: [self-hosted, macOS, p347-mac]
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"
      - name: Execute bounded Mac identity probe
        run: python3 probes/p347_mac_node_preflight.py
      - name: Upload raw Mac node preflight
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p347-mac-node-preflight-${{ github.sha }}
          path: p347-mac-node-preflight.json
          if-no-files-found: error
