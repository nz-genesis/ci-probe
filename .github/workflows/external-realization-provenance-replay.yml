name: External Realization Provenance Replay

on:
  push:
    branches: [main, 'research/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute provenance and replay probe
        run: PYTHONPATH=. python3 external_realization_provenance_replay.py
