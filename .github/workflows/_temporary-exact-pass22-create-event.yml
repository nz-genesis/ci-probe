name: TEMP exact Pass 22 commit verification

on:
  create:

permissions:
  contents: read

jobs:
  verify-exact-pass22:
    if: github.ref == 'refs/heads/verify/pass22-exact-53ffbdf-run'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: 53ffbdfbd97cc38b430d6665dbca6938ff42df63
        run: |
          set -eu
          test "${GITHUB_SHA}" = "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          echo "EXACT_SHA_PASS=${GITHUB_SHA}"
      - name: Run public-safe Pass 22 probe
        run: python3 probes/pass22_distributed_freshness_reservation.py
