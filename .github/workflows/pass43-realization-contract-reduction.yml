name: Pass 43 Realization Contract Reduction

on:
  push:
    paths:
      - 'probes/pass43_realization_contract_primitive_reduction.py'
      - '.github/workflows/pass43-realization-contract-reduction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass43:
    name: pass43-public-verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"
      - name: Execute Pass 43
        run: python3 probes/pass43_realization_contract_primitive_reduction.py
