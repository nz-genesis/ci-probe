name: In-Flight Authority

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  in-flight-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute in-flight authority probe
        run: python in_flight_authority.py
      - name: Execute regression tests
        run: python -m pytest -q in_flight_authority_test.py
