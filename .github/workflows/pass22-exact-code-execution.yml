name: Pass 22 Exact Code Execution

on:
  pull_request:

permissions:
  contents: read

jobs:
  exact-historical-code:
    name: execute-historical-pass22-code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact historical commit under test
        uses: actions/checkout@v4
        with:
          ref: 53ffbdfbd97cc38b430d6665dbca6938ff42df63
          fetch-depth: 1

      - name: Verify exact historical checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="53ffbdfbd97cc38b430d6665dbca6938ff42df63"
          test "$actual" = "$expected"
          printf 'WORKFLOW_EVENT_SHA=%s\nEXPECTED_HISTORICAL_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$expected" "$actual"

      - name: Run exact historical Pass 22 probe
        run: python3 probes/pass22_distributed_freshness_reservation.py
