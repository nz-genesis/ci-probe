name: Pass 46 Concurrent Delegation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass46:
    name: public-pass46
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'GITHUB_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$GITHUB_SHA" "$actual"

      - name: Execute Pass 46
        run: python3 probes/pass46_concurrent_delegation_revocation_cycles.py
