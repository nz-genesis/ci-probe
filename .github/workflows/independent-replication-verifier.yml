name: Independent Replication Verifier

on:
  push:
    paths:
      - 'independent-replication/**'
      - 'tools/verify_commitment.py'
      - 'tools/test_commitment_verifier.py'
      - '.github/workflows/independent-replication-verifier.yml'
  pull_request:
    paths:
      - 'independent-replication/**'
      - 'tools/verify_commitment.py'
      - 'tools/test_commitment_verifier.py'
      - '.github/workflows/independent-replication-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checkout identity
        shell: bash
        run: test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
      - name: Python syntax
        run: python -m py_compile independent-replication/verify_submission.py tools/verify_commitment.py tools/test_commitment_verifier.py
      - name: Challenge and manifest JSON
        run: python -c "import json; json.load(open('independent-replication/challenge-v1.json')); json.load(open('independent-replication/manifest-v1.json'))"
      - name: Manifest binds exact frozen challenge
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('independent-replication/manifest-v1.json').read_text())
          challenge = Path(manifest['challenge']['path'])
          actual = hashlib.sha256(challenge.read_bytes()).hexdigest()
          expected = manifest['challenge']['sha256']
          if actual != expected:
              raise SystemExit(f'manifest/challenge digest mismatch: {actual} != {expected}')
          print('PASS manifest frozen challenge digest', actual)
          PY
      - name: Synthetic contract test
        run: python independent-replication/verify_submission.py independent-replication/selftest-submission.json
      - name: Frozen challenge substitution must fail closed
        shell: bash
        run: |
          cp independent-replication/challenge-v1.json /tmp/substituted-challenge.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/substituted-challenge.json')
          data = json.loads(p.read_text())
          data['instructions'] = data['instructions'] + ' substituted'
          p.write_text(json.dumps(data, separators=(',', ':')))
          PY
          if python independent-replication/verify_submission.py independent-replication/selftest-submission.json --challenge /tmp/substituted-challenge.json; then
            echo 'Verifier accepted a substituted challenge; fail-closed contract is broken.'
            exit 1
          fi
          echo 'PASS substitution rejection'
      - name: Commit-reveal verifier tests
        run: python tools/test_commitment_verifier.py
