name: Historical Control — Blind Factorization

# HISTORICAL / CONTROL WORKFLOW
# The active materially independent reconstruction surface is
# independent-replication/ and uses IR-V2. This workflow remains in the
# repository only for historical provenance and is intentionally not triggered
# by normal push/pull_request events.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Historical control regression
        run: |
          set -euo pipefail
          python -m py_compile independence/verify_submission.py independence/test_verify_submission.py
          (cd independence && python test_verify_submission.py)
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          schema = json.loads(Path('independence/submission.schema.json').read_text())
          assert set(schema['properties']['protocol_version']['enum']) == {'BFV-1', 'BFV-2'}
          for version in ('v1', 'v2'):
              corpus = json.loads(Path(f'independence/neutral_corpus_{version}.json').read_text())
              expected = f'BFV-{version[-1]}'
              assert corpus['protocol_version'] == expected
              assert len(corpus['obligations']) >= 10
              ids = [x['obligation_id'] for x in corpus['obligations']]
              assert len(set(ids)) == len(ids)
              assert all(x['text'].strip() for x in corpus['obligations'])
              digest = hashlib.sha256(Path(f'independence/neutral_corpus_{version}.json').read_bytes()).hexdigest()
              print(f'PASS: {expected} frozen corpus sha256={digest}')
          PY
