name: Blind Factorization Structural Verification

on:
  push:
    paths:
      - 'independence/**'
      - '.github/workflows/blind-factorization.yml'
  pull_request:
    paths:
      - 'independence/**'
      - '.github/workflows/blind-factorization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python syntax check
        run: python -m py_compile independence/verify_submission.py independence/test_verify_submission.py
      - name: Run deterministic verifier regression
        working-directory: independence
        run: python test_verify_submission.py
      - name: Verify frozen corpora and schema
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          schema = json.loads(Path('independence/submission.schema.json').read_text())
          assert set(schema['properties']['protocol_version']['enum']) == {'BFV-1', 'BFV-2'}
          for version in ('v1', 'v2'):
              corpus = json.loads(Path(f'independence/neutral_corpus_{version}.json').read_text())
              expected = f'BFV-{version[-1]}'
              assert corpus['protocol_version'] == expected
              assert len(corpus['obligations']) >= 10
              ids = [x['obligation_id'] for x in corpus['obligations']]
              assert len(set(ids)) == len(ids)
              assert all(x['text'].strip() for x in corpus['obligations'])
              digest = hashlib.sha256(Path(f'independence/neutral_corpus_{version}.json').read_bytes()).hexdigest()
              print(f'PASS: {expected} frozen corpus sha256={digest}')
          PY
