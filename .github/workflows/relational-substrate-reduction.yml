name: Relational Substrate Reduction

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run reduction probe
        run: python3 probes/relational-substrate-reduction/test_relational_substrate.py
      - name: Run adversarial v2 probe
        run: python3 probes/relational-substrate-reduction/test_adversarial_v2.py
