name: External Realization Projection Mutation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-mutation:
    name: projection-mutation-red-team
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute projection mutation red-team
        run: PYTHONPATH=. python3 external_realization_projection_mutation.py
