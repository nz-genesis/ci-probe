name: Genesis Pass 33 Authority History

on:
  push:
    paths:
      - 'probes/pass33_authority_history.py'
      - '.github/workflows/pass33-authority-history.yml'
  pull_request:
    paths:
      - 'probes/pass33_authority_history.py'
      - '.github/workflows/pass33-authority-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Compile public probe
        run: python -m py_compile probes/pass33_authority_history.py

      - name: Run public probe
        run: python probes/pass33_authority_history.py
